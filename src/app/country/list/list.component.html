<section class="mt-5">
  <table class="table table-md mt-2 w-full">
    <thead>
      <tr>
        <th>#</th>

        <th>Bandera</th>
        <th>Nombre</th>
        <th>Capital</th>
        <th>Población</th>
        <th>Más información.</th>
      </tr>
    </thead>
    <tbody>
      @for (country of countries(); track country.uuid; let index=$index) {
      <tr>
        <td>{{index +1}}</td>
        <td><img [src]="country.flagUrlSvg" [alt]="country.name" width="40"></td>
        <td>{{country.name}}</td>
         <td>{{country.capitals}}</td>
         <span class="badge badge-secondary">
          <td>{{country.population | number}}</td>
         </span>

         <td><a
          [routerLink]="['/country/by', country.uuid]"
          class="link-primary cursor-pointer" >Más información.</a></td>
      </tr>
      } @empty {
      }

    </tbody>
  </table>
</section>
