<section class="mt-5">
  <table class="table table-md mt-2 w-full">
    <thead>
      <tr>
        <th>#</th>

        <th>Bandera</th>
        <th>Nombre</th>
        <th>Capital</th>
        <th>Población</th>
        <th>Más información.</th>
      </tr>
    </thead>
    <tbody>
      @for (country of countries(); track country.uuid; let index=$index) {
      <tr>
        <td>{{index +1}}</td>
        <td><img [src]="country.flag.url_svg" [alt]="country.names.common" width="40"></td>
        <td>{{country.names.common}}</td>
         <td>{{country.capitals[0]?.name}}</td>
         <td>{{country.population }}</td>
         <td><a class="link-primary cursor-pointer" >Más información.</a></td>
      </tr>
      } @empty {
      }

    </tbody>
  </table>
</section>
